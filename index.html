    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            user-select: none; /* Evita que el niño seleccione texto por accidente */
        }
        .btn-option {
            transition: all 0.2s;
        }
        .btn-option:active {
            transform: scale(0.95);
        }
        .correct {
            background-color: #4ade80 !important;
            color: white !important;
            border-color: #22c55e !important;
        }
        .incorrect {
            background-color: #f87171 !important;
            color: white !important;
            border-color: #ef4444 !important;
        }
        .hint-reveal {
            box-shadow: 0 0 15px 5px #4ade80;
            border: 3px solid #16a34a !important;
        }
        /* Animación para celebrar al final */
        @keyframes bounce {
            0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: none; animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }
        .animate-bounce-slow {
            animation: bounce 2s infinite;
        }
    </style>
</head>

            </button>

            </div>
        </div>

            </h3>

        </div>

                { q: "El sol es muy importante, es un factor...", options: ["Biótico", "Abiótico", "Animal"], ans: 1 },
                { q: "Los animales que tienen plumas y vuelan se mueven por...", options: ["El agua", "El aire", "La tierra"], ans: 1 },
                { q: "El agua la usamos para...", options: ["Beber y bañarnos", "Ensuciar la ropa", "No sirve"], ans: 0 },
                { q: "Un búho que tiene los ojos muy grandes para ver en la oscuridad es...", options: ["Diurno", "Nocturno", "Biótico"], ans: 1 },
                { q: "Moverse como un trompo dando vueltas es...", options: ["Girar", "Deslizar", "Rodar"], ans: 0 },
                { q: "Un hongo en el bosque es un factor...", options: ["Biótico (vivo)", "Abiótico (sin vida)", "Nocturno"], ans: 0 },
                { q: "Las nubes, la lluvia y las rocas son factores...", options: ["Bióticos", "Abióticos", "Con huesos"], ans: 1 },
                { q: "Una rosa es una planta con...", options: ["Frutos", "Flores", "Espinas gigantes"], ans: 1 },
                { q: "Los pinos (como los árboles de Navidad) son plantas que generalmente...", options: ["Dan manzanas", "Son sin flores llamativas", "Son diurnos"], ans: 1 },
                { q: "Las manzanas y las peras crecen en árboles con...", options: ["Frutos", "Llantas", "Dulces"], ans: 0 },
                { q: "Un desierto lleno de arena y cactus es un...", options: ["Centro comercial", "Entorno natural", "Juego de mesa"], ans: 1 },
                { q: "Los murciélagos salen a volar cuando oscurece, son animales...", options: ["Diurnos", "Nocturnos", "Abióticos"], ans: 1 },
                { q: "Las abejas buscan las flores cuando hay mucho sol, son animales...", options: ["Nocturnos", "Diurnos", "Sin alas"], ans: 1 },
                { q: "Un caracol es un animal...", options: ["Con muchos huesos", "Sin huesos (invertebrado)", "Que vuela"], ans: 1 },
                { q: "Un pulpo que vive en el mar es un animal...", options: ["Con huesos", "Sin huesos", "Terrestre"], ans: 1 },
                { q: "Un perrito es un animal...", options: ["Sin huesos", "Con huesos (vertebrado)", "Abiótico"], ans: 1 },
                { q: "Cuando empujas una caja, la alejas de ti. Cuando la JALAS...", options: ["La acercas hacia ti", "La rompes", "Se queda en reposo"], ans: 0 },
                { q: "Las llantas de una bicicleta avanzan al...", options: ["Deslizar", "Rodar", "Saltar"], ans: 1 },
                { q: "Cuando un coche está estacionado y apagado, decimos que está en...", options: ["Movimiento", "Reposo", "Vuelo"], ans: 1 },
                { q: "¿Es correcto tirar envolturas de galletas en los ríos?", options: ["Sí, para que los peces coman", "No, porque contamina el medio ambiente", "Sí, no pasa nada"], ans: 1 },
                { q: "Darle agua a los pajaritos o cuidar a las mascotas es una forma de...", options: ["Respetar a los seres vivos", "Jugar", "Contaminar"], ans: 0 },
                { q: "El viento que mueve las hojas de los árboles es un factor...", options: ["Biótico", "Abiótico", "Diurno"], ans: 1 },
                { q: "Si arrastras tu mochila por el piso sin levantarla, la estás...", options: ["Rodando", "Girando", "Deslizando"], ans: 2 },
                { q: "El agua limpia de los ríos y manantiales es un importante...", options: ["Recurso natural", "Factor biótico", "Juguete"], ans: 0 },
                { q: "Regar las plantas de tu casa es una buena forma de...", options: ["Cuidar tu entorno", "Desperdiciar agua", "Hacer lodo"], ans: 0 }
            ]
        };

        const subjectNames = {
            espanol: "📚 Español",
            matematicas: "🔢 Matemáticas",
            ingles: "🌎 Inglés",
            naturaleza: "🌱 Naturaleza"
        };

        // ESTADOS DE LA APLICACIÓN
        let currentQuestions = [];
        let currentSubject = "";
        let currentIndex = 0;
        let score = 0;
        let isAnswered = false;

        // ELEMENTOS DEL DOM
        const homeScreen = document.getElementById('home-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const subjectTitle = document.getElementById('subject-title');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const questionCounter = document.getElementById('question-counter');
        const finalScore = document.getElementById('final-score');

        // FUNCIÓN: Iniciar el juego
        function startQuiz(subject) {
            currentSubject = subject;
            // Barajar las preguntas para que no salgan siempre en el mismo orden
            currentQuestions = [...db[subject]].sort(() => Math.random() - 0.5);
            
            // Si quieres limitarlo a menos preguntas por ronda, puedes hacer:
            // currentQuestions = currentQuestions.slice(0, 10); 
            // Pero como pediste 20, usaremos las 20.

            currentIndex = 0;
            score = 0;
            
            subjectTitle.innerText = subjectNames[subject];
            
            homeScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            quizScreen.classList.add('flex');
            
            loadQuestion();
        }

        // FUNCIÓN: Cargar una pregunta en pantalla
        function loadQuestion() {
            isAnswered = false;
            nextBtn.classList.add('hidden');
            
            const qData = currentQuestions[currentIndex];
            questionText.innerText = qData.q;
            questionText.dataset.ans = qData.ans; // Guardar la respuesta para el "cheat mode"
            
            // Actualizar contadores y progreso
            questionCounter.innerText = `${currentIndex + 1} / ${currentQuestions.length}`;
            const progress = ((currentIndex) / currentQuestions.length) * 100;
            progressBar.style.width = `${progress}%`;

            // Limpiar opciones anteriores
            optionsContainer.innerHTML = '';

            // Generar botones de opciones
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `btn-option w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-6 px-6 rounded-2xl border-4 border-gray-200 text-xl md:text-2xl text-left flex items-center gap-4`;
                btn.innerHTML = `<span class="bg-white text-blue-500 rounded-full w-10 h-10 flex items-center justify-center font-black shrink-0 border-2 border-blue-200 shadow-sm">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
                btn.onclick = () => selectOption(index, qData.ans, btn);
                btn.dataset.index = index; // Para el truco oculto
                optionsContainer.appendChild(btn);
            });
        }

        // FUNCIÓN: Manejar la selección del usuario
        function selectOption(selectedIndex, correctIndex, selectedBtn) {
            if (isAnswered) return; // Evitar múltiples clics
            isAnswered = true;

            const allBtns = optionsContainer.querySelectorAll('button');
            
            if (selectedIndex === correctIndex) {
                // Correcto
                selectedBtn.classList.add('correct');
                score++;
                playAudio(true);
            } else {
                // Incorrecto
                selectedBtn.classList.add('incorrect');
                // Resaltar la correcta
                allBtns[correctIndex].classList.add('correct');
                playAudio(false);
            }

            // Deshabilitar botones
            allBtns.forEach(b => b.classList.add('opacity-80', 'cursor-not-allowed'));
            selectedBtn.classList.remove('opacity-80');
            allBtns[correctIndex].classList.remove('opacity-80');

            // Mostrar botón de siguiente
            nextBtn.classList.remove('hidden');
            
            // Progreso completo si es la última
            if(currentIndex === currentQuestions.length - 1) {
                 progressBar.style.width = `100%`;
                 nextBtn.innerText = "¡Ver mis resultados! 🌟";
            } else {
                 nextBtn.innerText = "¡Siguiente! 🚀";
            }
        }

        // FUNCIÓN OCULTA (Para el Tío Miguel)
        function revealAnswer() {
            if (isAnswered) return; // Si ya contestó, no hacer nada
            const correctIndex = currentQuestions[currentIndex].ans;
            const allBtns = optionsContainer.querySelectorAll('button');
            
            // Quitar estilos previos por si hace doble clic varias veces
            allBtns.forEach(b => b.classList.remove('hint-reveal'));
            
            // Añadir un resaltado sutil al correcto
            allBtns[correctIndex].classList.add('hint-reveal');
        }

        // FUNCIÓN: Avanzar a la siguiente o terminar
        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // FUNCIÓN: Mostrar resultados
        function showResults() {
            quizScreen.classList.add('hidden');
            quizScreen.classList.remove('flex');
            resultScreen.classList.remove('hidden');
            finalScore.innerText = score;
            document.getElementById('total-score-display').innerText = currentQuestions.length;
        }

        // FUNCIÓN: Regresar al inicio
        function goHome() {
            quizScreen.classList.add('hidden');
            quizScreen.classList.remove('flex');
            resultScreen.classList.add('hidden');
            homeScreen.classList.remove('hidden');
        }

        // FUNCIÓN: Sonidos simples sintéticos (sin archivos externos)
        function playAudio(isCorrect) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (isCorrect) {
                    // Sonido feliz agudo
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else {
                    // Sonido grave "error"
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {
                // Silencio si el navegador bloquea el audio
            }
        }
    </script>
