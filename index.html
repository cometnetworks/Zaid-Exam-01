<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Aprende Jugando! - Repaso 1er Grado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            user-select: none;
            touch-action: pan-y;
            overflow-x: hidden;
        }

        .btn-option {
            transition: all 0.2s;
        }

        .btn-option:active {
            transform: scale(0.95);
        }

        .correct {
            background-color: #4ade80 !important;
            color: white !important;
            border-color: #22c55e !important;
        }

        .incorrect {
            background-color: #f87171 !important;
            color: white !important;
            border-color: #ef4444 !important;
        }

        .hint-reveal {
            box-shadow: 0 0 15px 5px #4ade80;
            border: 3px solid #16a34a !important;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(-15%);
                animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
            }

            50% {
                transform: none;
                animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
            }
        }

        .animate-bounce-slow {
            animation: bounce 2s infinite;
        }

        /* Drag and Drop Custom Styles */
        .draggable {
            touch-action: none;
            cursor: grab;
            z-index: 20;
            position: relative;
        }

        .draggable:active {
            cursor: grabbing;
        }

        .dropzone {
            border: 3px dashed #cbd5e1;
            transition: all 0.3s;
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.5);
            position: relative;
        }

        .dropzone.filled {
            border: 3px solid #22c55e;
            background-color: #f0fdf4;
            border-style: solid;
        }

        .dragging-clone {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.9;
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: none;
            margin: 0;
        }

        /* Canvas para líneas */
        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .match-dot {
            width: 28px;
            height: 28px;
            background: #3b82f6;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
            border: 4px solid white;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.4);
            touch-action: none;
            position: relative;
            z-index: 20;
        }

        /* Custom classes para 3D Flip */
        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .is-flipped {
            transform: rotateY(180deg);
        }
    </style>
</head>

        let currentQuestions = []; let currentIndex = 0; let score = 0; let isAnswered = false;

        // --- FUNCIONES DE STORAGE Y DASHBOARD --- 
        function saveProgress() {
            if (!currentSubject) return;
            const progress = {
                questions: currentQuestions,
                index: currentIndex,
                score: score,
                timestamp: new Date().getTime()
            };
            localStorage.setItem(`zaid_progreso_${currentSubject}`, JSON.stringify(progress));
        }

        function loadProgress(subject) {
            const data = localStorage.getItem(`zaid_progreso_${subject}`);
            return data ? JSON.parse(data) : null;
        }

        function clearProgress(subject) {
            localStorage.removeItem(`zaid_progreso_${subject}`);
        }

        function recordCompletedExam(subject, finalScore, total) {
            clearProgress(subject);
            let metrics = JSON.parse(localStorage.getItem('zaid_metrics')) || { completed: 0, totalScore: 0, totalPossible: 0 };
            metrics.completed += 1;
            metrics.totalScore += finalScore;
            metrics.totalPossible += total;
            localStorage.setItem('zaid_metrics', JSON.stringify(metrics));
        }

        function clearAllProgress() {
            if (confirm('¿Estás seguro de que quieres borrar todo tu progreso y empezar de cero?')) {
                localStorage.clear();
                showDashboard(); // Refrescar vista
            }
        }

        function showDashboard() {
            const dash = document.getElementById('dashboard-overlay');
            const metricsDiv = document.getElementById('dashboard-metrics');
            let metrics = JSON.parse(localStorage.getItem('zaid_metrics')) || { completed: 0, totalScore: 0, totalPossible: 0 };

            let html = `
                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-200 text-center mb-4">
                    <p class="text-indigo-800 font-bold text-lg">Exámenes Terminados</p>
                    <p class="text-4xl font-black text-indigo-600">${metrics.completed}</p>
                </div>
            `;

            if (metrics.totalPossible > 0) {
                const percentage = Math.round((metrics.totalScore / metrics.totalPossible) * 100);
                html += `
                    <div class="bg-green-50 p-4 rounded-xl border border-green-200 text-center mb-4">
                        <p class="text-green-800 font-bold text-lg">Promedio de Aciertos</p>
                        <p class="text-4xl font-black ${percentage >= 80 ? 'text-green-600' : 'text-orange-500'}">${percentage}%</p>
                    </div>
                `;
            } else {
                html += `<p class="text-center text-gray-500 italic">¡Termina un examen para ver tu promedio!</p>`;
            }

            // Exámenes en pausa
            const subjects = ['espanol', 'matematicas', 'ingles', 'naturaleza'];
            let pendingHtml = '';
            subjects.forEach(sub => {
                const prog = loadProgress(sub);
                if (prog && prog.index > 0 && prog.index < prog.questions.length) {
                    const subNames = { espanol: "Español", matematicas: "Matemáticas", ingles: "Inglés", naturaleza: "Naturaleza" };
                    pendingHtml += `
                        <div class="flex justify-between items-center bg-yellow-50 p-3 rounded-lg border border-yellow-200 mb-2">
                            <span class="font-bold text-gray-700">${subNames[sub]}</span>
                            <span class="text-sm bg-yellow-200 text-yellow-800 px-2 py-1 rounded-full font-bold">Pregunta ${prog.index + 1}/40</span>
                        </div>
                    `;
                }
            });

            if (pendingHtml) {
                html += `<h3 class="font-bold text-gray-800 mt-4 mb-2 border-b-2 border-gray-100 pb-1">En Pausa:</h3>${pendingHtml}`;
            }

            metricsDiv.innerHTML = html;
            dash.classList.remove('hidden');
            dash.classList.add('flex');
        }

        // Variable temporal para reanudar
        let tempSubjectToResume = '';

        function startQuiz(subject) {
            tempSubjectToResume = subject;
            const saved = loadProgress(subject);

            if (saved && saved.index > 0 && saved.index < saved.questions.length) {
                // Hay progreso guardado
                const subjectNames = { espanol: "Español", matematicas: "Matemáticas", ingles: "Inglés", naturaleza: "Naturaleza" };
                document.getElementById('resume-subject').innerText = subjectNames[subject];
                document.getElementById('resume-overlay').classList.remove('hidden');
                document.getElementById('resume-overlay').classList.add('flex');
            } else {
                initQuiz(subject, false);
            }

            document.getElementById('resume-overlay').classList.add('hidden');

        }

        function restartQuiz() {
            if (confirm('¿Estás seguro de que quieres volver a empezar este examen? Se borrará el progreso actual.')) {
                clearProgress(currentSubject);
                initQuiz(currentSubject, false);
            }
        }

        function initQuiz(subject, loadSaved) {
            goHome(); // Ensure all other screens are hidden
            document.getElementById('home-screen').classList.add('hidden'); // Fix overlap

            currentSubject = subject;
            const subjectNames = { espanol: "📚 Español", matematicas: "🔢 Matemáticas", ingles: "🌎 Inglés", naturaleza: "🌱 Naturaleza" };
            document.getElementById('subject-title').innerText = subjectNames[subject];

            if (loadSaved) {
                const saved = loadProgress(subject);
                currentQuestions = saved.questions;
                currentIndex = saved.index;
                score = saved.score;
            } else {
                currentQuestions = [...db[subject]].sort(() => Math.random() - 0.5).slice(0, 40);
                currentIndex = 0;
                score = 0;
            }

            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('flex');
            loadQuestion();
            if (currentIndex > 0) saveProgress(); // Force save if resumed
        }

        function loadQuestion() {
            isAnswered = false; document.getElementById('next-btn').classList.add('hidden');
            const qData = currentQuestions[currentIndex];
            const qText = document.getElementById('question-text');
            qText.innerText = qData.q; qText.dataset.ans = qData.ans;
            document.getElementById('question-counter').innerText = `${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;

            const opts = document.getElementById('options-container'); opts.innerHTML = '';
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `btn-option w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-6 px-4 md:px-6 rounded-2xl border-4 border-gray-200 text-lg md:text-2xl text-left flex items-center gap-4`;
                btn.innerHTML = `<span class="bg-white text-blue-500 rounded-full w-10 h-10 flex items-center justify-center font-black shrink-0 border-2 border-blue-200">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
                btn.onclick = () => selectOption(index, qData.ans, btn);
                opts.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, correctIndex, selectedBtn) {
            if (isAnswered) return; isAnswered = true;
            const allBtns = document.getElementById('options-container').querySelectorAll('button');
            if (selectedIndex === correctIndex) {
                selectedBtn.classList.add('correct'); score++; playAudio(true);
            } else {
                selectedBtn.classList.add('incorrect'); allBtns[correctIndex].classList.add('correct'); playAudio(false);
            }
            allBtns.forEach(b => b.classList.add('opacity-80', 'cursor-not-allowed'));
            selectedBtn.classList.remove('opacity-80'); allBtns[correctIndex].classList.remove('opacity-80');

            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('hidden');
            nextBtn.innerText = currentIndex === currentQuestions.length - 1 ? "¡Ver mis resultados! 🌟" : "¡Siguiente! 🚀";
        }

        function revealAnswer() {
            if (isAnswered) return;
            const correctIndex = currentQuestions[currentIndex].ans;
            const allBtns = document.getElementById('options-container').querySelectorAll('button');
            allBtns.forEach(b => b.classList.remove('hint-reveal'));
            allBtns[correctIndex].classList.add('hint-reveal');
        }

        function nextQuestion() {
            currentIndex++;
            saveProgress(); // Guardar progreso al avanzar

            if (currentIndex < currentQuestions.length) loadQuestion();
            else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('flex');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
                document.getElementById('total-score-display').innerText = currentQuestions.length;

                // Registrar métricas finales y limpiar progreso local de la materia
                recordCompletedExam(currentSubject, score, currentQuestions.length);
                currentSubject = ''; // Limpiar
            }
        }

                        <div class="draggable bg-blue-500 text-white font-bold py-2 px-3 rounded-xl shadow-lg" data-match="desarrollo">Desarrollo</div>
                        <div class="draggable bg-red-500 text-white font-bold py-2 px-3 rounded-xl shadow-lg" data-match="final">Final</div>
                        <div class="draggable bg-purple-500 text-white font-bold py-2 px-3 rounded-xl shadow-lg" data-match="principal">${randomStory.principal}</div>
                        <div class="draggable bg-orange-500 text-white font-bold py-2 px-3 rounded-xl shadow-lg" data-match="secundario">${randomStory.secundario}</div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-white p-4 rounded-lg border-2 border-gray-200">
                            <p class="font-bold text-gray-600 mb-2">Orden de la historia (Arrastra):</p>
                            <div class="flex items-center gap-2 mb-2"><span class="text-xs md:text-sm w-1/3">1. Empieza...</span> <div class="dropzone flex-1 h-12" data-target="inicio"></div></div>
                            <div class="flex items-center gap-2 mb-2"><span class="text-xs md:text-sm w-1/3">2. Problema...</span> <div class="dropzone flex-1 h-12" data-target="desarrollo"></div></div>
                            <div class="flex items-center gap-2 mb-2"><span class="text-xs md:text-sm w-1/3">3. Termina...</span> <div class="dropzone flex-1 h-12" data-target="final"></div></div>
                        </div>
                        <div class="bg-white p-4 rounded-lg border-2 border-gray-200">
                            <p class="font-bold text-gray-600 mb-2">Identifica a los Personajes:</p>
                            <div class="flex items-center gap-2 mb-4"><span class="text-xs md:text-sm w-1/3 font-bold text-purple-600">👑 Principal</span> <div class="dropzone flex-1 h-12" data-target="principal"></div></div>
                            <div class="flex items-center gap-2"><span class="text-xs md:text-sm w-1/3 font-bold text-orange-600">🤝 Secundario</span> <div class="dropzone flex-1 h-12" data-target="secundario"></div></div>
                        </div>
                    </div>
                `;
                initPointerDragDrop();
            }
            else if (type === 'onomatopeyas') {
                document.getElementById('minigame-title').innerText = "🖍️ Une los Sonidos";
                totalMatches = 4;

                const pairs = [...ONOMATOPEYAS_DB].sort(() => Math.random() - 0.5).slice(0, 4);
                const leftCol = [...pairs].sort(() => Math.random() - 0.5);
                const rightCol = [...pairs].sort(() => Math.random() - 0.5);

                let leftHTML = leftCol.map(p => `
                    <div class="flex items-center justify-between bg-blue-100 p-2 md:p-4 rounded-xl border-2 border-blue-300 w-full mb-4">
                        <button onclick="playSound('${p.vocal}', '${p.id}')" class="bg-white rounded-full p-2 shadow hover:bg-gray-100 text-2xl">🔊</button>
                        <span class="font-bold text-lg md:text-xl text-blue-800 ml-2">${p.snd}</span>
                        <div class="match-dot left-dot ml-auto" data-id="${p.id}"></div>
                    </div>
                `).join('');

                let rightHTML = rightCol.map(p => `
                    <div class="flex items-center justify-between bg-green-100 p-2 md:p-4 rounded-xl border-2 border-green-300 w-full mb-4">
                        <div class="match-dot right-dot mr-auto" data-id="${p.id}"></div>
                        <span class="font-bold text-lg md:text-xl text-green-800 mr-2">${p.img}</span>
                    </div>
                `).join('');

                content.innerHTML = `
                    <p class="text-center font-bold text-gray-600 mb-4">Toca 🔊 para escuchar. ¡Une el punto azul con el animal correcto!</p>
                    <div class="relative w-full border-2 border-dashed border-gray-200 rounded-xl bg-gray-50" id="canvas-container" style="height: 400px; touch-action: none;">
                        <canvas id="line-canvas"></canvas>
                        <div class="absolute w-full h-full flex justify-between px-2 md:px-4 py-4">
                            <div class="w-[45%] flex flex-col justify-around" id="left-items">${leftHTML}</div>
                            <div class="w-[45%] flex flex-col justify-around" id="right-items">${rightHTML}</div>
                        </div>
                    </div>
                `;
                setTimeout(initCanvasDrawing, 100);
            }
            else if (type === 'memorama') {
                document.getElementById('minigame-title').innerText = "🎴 Memoria de Textos";
                content.innerHTML = `
                    <p class="text-center font-bold text-gray-600 mb-4">¡Encuentra los pares! Ej: "Había una vez..." va con "Inicio de un cuento".</p>
                    <div id="memo-grid" class="grid grid-cols-3 md:grid-cols-4 gap-3"></div>
                `;
                initMemorama();
            }
        }

        // ==========================================
        // 4. NUEVO SISTEMA DRAG & DROP (POINTER EVENTS)
        // Funciona perfecto en Touch y Mouse simulando arrastre visual
        // ==========================================
        let activeDragEl = null; let dragClone = null;

        function initPointerDragDrop() {
            const draggables = document.querySelectorAll('.draggable');
            draggables.forEach(el => {
                el.addEventListener('pointerdown', handleDragStart);
            });
        }

        function handleDragStart(e) {
            if (e.target.parentElement.classList.contains('dropzone')) return;

            activeDragEl = e.target.closest('.draggable');
            if (!activeDragEl) return;

            e.preventDefault();

            dragClone = activeDragEl.cloneNode(true);
            dragClone.classList.add('dragging-clone');
            document.body.appendChild(dragClone);

            moveClone(e.clientX, e.clientY);

            document.addEventListener('pointermove', handleDragMove, { passive: false });
            document.addEventListener('pointerup', handleDragEnd);
        }

        function moveClone(x, y) {
            if (!dragClone) return;
            dragClone.style.left = (x - dragClone.offsetWidth / 2) + 'px';
            dragClone.style.top = (y - dragClone.offsetHeight / 2) + 'px';
        }

        function handleDragMove(e) {
            if (!dragClone) return;
            e.preventDefault();
            moveClone(e.clientX, e.clientY);
        }

        function handleDragEnd(e) {
            document.removeEventListener('pointermove', handleDragMove);
            document.removeEventListener('pointerup', handleDragEnd);

            if (!dragClone || !activeDragEl) return;

            dragClone.style.display = 'none';
            let elemBelow = document.elementFromPoint(e.clientX, e.clientY);
            let dropzone = elemBelow ? elemBelow.closest('.dropzone') : null;

            if (dropzone && !dropzone.classList.contains('filled')) {
                if (dropzone.dataset.target === activeDragEl.dataset.match) {
                    dropzone.innerHTML = '';
                    dropzone.appendChild(activeDragEl);
                    dropzone.classList.add('filled');
                    activeDragEl.style.margin = '0';
                    playAudio(true);
                    correctMatches++;
                    if (correctMatches === totalMatches) {
                        setTimeout(() => document.getElementById('minigame-success').classList.remove('hidden'), 400);
                        playAudio(true);
                    }
                } else {
                    playAudio(false);
                    dropzone.classList.add('bg-red-100', 'border-red-500');
                    setTimeout(() => dropzone.classList.remove('bg-red-100', 'border-red-500'), 400);
                }
            } else {
                playAudio(false);
            }

            dragClone.remove();
            dragClone = null;
            activeDragEl = null;
        }

        // ==========================================
        // 5. CANVAS: TRAZAR LÍNEAS (POINTER EVENTS)
        // ==========================================
        function initCanvasDrawing() {
            const canvas = document.getElementById('line-canvas');
            const container = document.getElementById('canvas-container');
            if (!canvas || !container) return;

            const ctx = canvas.getContext('2d');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            let isDrawing = false; let startDot = null;
            let currentX = 0; let currentY = 0;
            let lines = [];

            const getCenter = (el) => {
                const rect = el.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                return {
                    x: rect.left - containerRect.left + rect.width / 2,
                    y: rect.top - containerRect.top + rect.height / 2
                };
            };

            const drawAll = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';

                lines.forEach(l => {
                    const p1 = getCenter(l.startEl); const p2 = getCenter(l.endEl);
                    ctx.strokeStyle = '#22c55e';
                    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                });

                if (isDrawing && startDot) {
                    const p1 = getCenter(startDot);
                    ctx.strokeStyle = '#3b82f6';
                    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(currentX, currentY); ctx.stroke();
                }
            };

            container.onpointerdown = (e) => {
                const el = document.elementFromPoint(e.clientX, e.clientY);
                if (el && el.classList.contains('left-dot') && !el.classList.contains('matched-dot')) {
                    isDrawing = true; startDot = el;
                    const containerRect = container.getBoundingClientRect();
                    currentX = e.clientX - containerRect.left;
                    currentY = e.clientY - containerRect.top;
                    e.preventDefault();
                }
            };

            container.onpointermove = (e) => {
                if (!isDrawing) return;
                const containerRect = container.getBoundingClientRect();
                currentX = e.clientX - containerRect.left;
                currentY = e.clientY - containerRect.top;
                drawAll();
                e.preventDefault();
            };

            container.onpointerup = (e) => {
                if (!isDrawing) return;
                isDrawing = false;

                const el = document.elementFromPoint(e.clientX, e.clientY);
                if (el && el.classList.contains('right-dot') && !el.classList.contains('matched-dot')) {
                    if (el.dataset.id === startDot.dataset.id) {
                        lines.push({ startEl: startDot, endEl: el });
                        startDot.classList.add('matched-dot'); el.classList.add('matched-dot');
                        playAudio(true); correctMatches++;
                        if (correctMatches === totalMatches) {
                            setTimeout(() => document.getElementById('minigame-success').classList.remove('hidden'), 500);
                        }
                    } else {
                        playAudio(false);
                    }
                }
                drawAll(); startDot = null;
            };

            window.onresize = () => {
                canvas.width = container.clientWidth; canvas.height = container.clientHeight; drawAll();
            };
        }

        // ==========================================
        // 6. UTILIDADES: AUDIO Y TEXT-TO-SPEECH
        // ==========================================
        let preferredVoice = null;

        window.speechSynthesis.onvoiceschanged = () => {
            const voices = window.speechSynthesis.getVoices();
            preferredVoice = voices.find(v => v.lang.includes('es-MX') || v.lang.includes('es-ES') || v.lang.includes('es_US'));
        };

        function readStoryText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-MX';
                utterance.rate = 0.85;
                utterance.pitch = 1.2;
                if (preferredVoice) utterance.voice = preferredVoice;
                window.speechSynthesis.speak(utterance);
            }
        }

        function playSound(text_or_path, id_for_audio = null) {
            if (id_for_audio) {
                const audioFile = new Audio(`sounds/${id_for_audio}.mp3`);
                audioFile.play().catch(e => {
                    console.log("No audio file found, falling back to TTS for: ", text_or_path);
                    fallbackToTTS(text_or_path);
                });
            } else {
                fallbackToTTS(text_or_path);
            }
        }

        function fallbackToTTS(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-MX';
                utterance.rate = 1.0;
                utterance.pitch = 1.8;
                if (preferredVoice) utterance.voice = preferredVoice;
                window.speechSynthesis.speak(utterance);
            }
        }

        function playAudio(isCorrect) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);

                if (isCorrect) {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(500, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                } else {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                }
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } catch (e) { }
        }

        function solveMinigame() {
            if (currentGameType === 'nota' || currentGameType === 'carta' || currentGameType === 'cuento') {
                document.querySelectorAll('.dropzone').forEach(zone => {
                    const matchId = zone.dataset.target;
                    const dragEl = document.querySelector(`.draggable[data-match="${matchId}"]`);
                    if (dragEl && !zone.classList.contains('filled')) {
                        dragEl.style.margin = '0'; zone.innerHTML = ''; zone.appendChild(dragEl); zone.classList.add('filled');
                    }
                });
                document.getElementById('minigame-success').classList.remove('hidden');
            } else if (currentGameType === 'memorama') {
                document.querySelectorAll('.memo-card:not(.matched)').forEach(card => card.classList.add('flipped', 'matched'));
                setTimeout(() => document.getElementById('minigame-success').classList.remove('hidden'), 500);
            }
        }


        // ==========================================
        // 7. LÓGICA TARJETAS DE REPASO (FLASHCARDS)
        // ==========================================
        let fcQuestions = []; let fcIndex = 0;

        function showFlashcardsSubjectMenu() {
            goHome(); // Reset todo
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('flashcards-subject-menu').classList.remove('hidden');
            document.getElementById('flashcards-subject-menu').classList.add('flex');
        }

        function startFlashcards(subject) {
            goHome(); // Ensure all other screens are hidden
            const subjectNames = { espanol: "📚 Español", matematicas: "🔢 Matemáticas", ingles: "🌎 Inglés", naturaleza: "🌱 Naturaleza" };
            // Tomas las 40 preguntas correspondientes a la materia
            fcQuestions = [...db[subject]].sort(() => Math.random() - 0.5).slice(0, 40);
            fcIndex = 0;

            document.getElementById('fc-subject-title').innerText = subjectNames[subject];
            document.getElementById('home-screen').classList.add('hidden'); // Faltaba ocultar el home
            document.getElementById('flashcards-subject-menu').classList.add('hidden');
            document.getElementById('flashcards-subject-menu').classList.remove('flex');
            document.getElementById('flashcards-screen').classList.remove('hidden');
            document.getElementById('flashcards-screen').classList.add('flex');

            loadFlashcard();
        }

        function loadFlashcard() {
            const fcInner = document.getElementById('fc-inner');
            fcInner.classList.remove('is-flipped'); // Asegurar que muestre el frente

            setTimeout(() => {
                const qData = fcQuestions[fcIndex];
                document.getElementById('fc-question').innerText = qData.q;
                document.getElementById('fc-answer').innerText = qData.options[qData.ans];
                document.getElementById('fc-counter').innerText = `${fcIndex + 1} / ${fcQuestions.length}`;
            }, 100); // Pequeño delay para que no se vea el cambio si estaba volteada
        }

        function flipCard() {
            document.getElementById('fc-inner').classList.toggle('is-flipped');
            playAudio(true); // Pequeño sonidito de volteo
        }

        function nextFlashcard() {
            if (fcIndex < fcQuestions.length - 1) {
                fcIndex++;
                loadFlashcard();
            } else {
                // Termina
                showFlashcardsSubjectMenu();
            }
        }

        function prevFlashcard() {
            if (fcIndex > 0) {
                fcIndex--;
                loadFlashcard();
            }
        }


        // ==========================================
        // 8. LÓGICA MEMORIA DE TEXTOS (MEMORAMA)
        // ==========================================
        const MEMO_PAIRS = [
            { id: 1, text1: "Querido\namigo:", text2: "Saludo de\nuna Carta" },
            { id: 2, text1: "Monterrey, N.L.\na 5 de Mayo", text2: "Lugar y Fecha\nde Carta" },
            { id: 3, text1: "Atentamente,\ntu amigo Zaid", text2: "Despedida\ny Firma" },
            { id: 4, text1: "Había una\nvez...", text2: "Inicio de\nun Cuento" },
            { id: 5, text1: "Y vivieron felices\npara siempre.", text2: "Final de\nun Cuento" },
            { id: 6, text1: "Se perdió\nPerrito Café", text2: "Título de\nNota Infor." }
        ];

        let memoCards = [];
        let flippedMemoCards = [];
        let memoMatches = 0;

        function initMemorama() {
            const grid = document.getElementById('memo-grid');
            grid.innerHTML = '';
            memoCards = [];
            flippedMemoCards = [];
            memoMatches = 0;

            const cardsData = [];
            MEMO_PAIRS.forEach(pair => {
                cardsData.push({ id: pair.id, type: 'a', text: pair.text1 });
                cardsData.push({ id: pair.id, type: 'b', text: pair.text2 });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data, index) => {
                const cardFront = document.createElement('div');
                cardFront.className = 'memo-card h-24 md:h-32';
                cardFront.dataset.id = data.id;
                cardFront.dataset.index = index;

                cardFront.innerHTML = `
                    <div class="memo-inner shadow-md rounded-xl">
                        <div class="memo-front">?</div>
                        <div class="memo-back border-4 shadow-inner">${data.text.replace(/\n/g, '<br>')}</div>
                    </div>
                `;

                cardFront.onclick = () => flipMemoCard(cardFront);
                grid.appendChild(cardFront);
                memoCards.push(cardFront);
            });

            totalMatches = MEMO_PAIRS.length;
        }

        function flipMemoCard(card) {
            if (flippedMemoCards.length === 2 || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedMemoCards.push(card);
            playAudio(true); // Flip sound

            if (flippedMemoCards.length === 2) {
                checkMemoMatch();
            }
        }

        function checkMemoMatch() {
            const [card1, card2] = flippedMemoCards;

            if (card1.dataset.id === card2.dataset.id) {
                // Match
                card1.classList.add('matched');
                card2.classList.add('matched');
                memoMatches++;
                flippedMemoCards = []; // Reset fast allowing to quickly click others

                setTimeout(() => playAudio(true), 150);

                if (memoMatches === totalMatches) {
                    setTimeout(() => document.getElementById('minigame-success').classList.remove('hidden'), 600);
                }
            } else {
                // No match
                setTimeout(() => playAudio(false), 300);
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedMemoCards = [];
                }, 1000);
            }
        }
    </script>
